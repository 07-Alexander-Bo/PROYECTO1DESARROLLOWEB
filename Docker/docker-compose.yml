services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sistema-climatico-sql

    environment:
      ACCEPT_EULA: "Y"
      # La contraseña sale del archivo Docker/.env
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Falta MSSQL_SA_PASSWORD. Copia Docker/.env.example a Docker/.env y define la contraseña}

    ports:
      - "1434:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

    restart: unless-stopped

volumes:
  sqlserver_data: