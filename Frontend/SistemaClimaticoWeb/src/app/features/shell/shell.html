<div class="sc-app sc-shell">
  <div class="sc-sidebar">
    <div style="display:flex; align-items:center; gap:9px; padding:0 8px 24px;">
      <div style="width:30px; height:30px; border-radius:8px; background:var(--sc-accent-deep); display:flex; align-items:center; justify-content:center;">
        <span class="sc-display" style="color:var(--sc-accent); font-weight:700; font-size:13px;">V</span>
      </div>
      <div>
        <div class="sc-display" style="font-weight:600; font-size:14.5px;">Vigia</div>
        <div style="font-size:10px; color:var(--sc-text-muted);">Alerta temprana</div>
      </div>
    </div>

    <a class="sc-sidebar-link" routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a class="sc-sidebar-link" routerLink="/sensores" routerLinkActive="active">Sensores</a>
    <a class="sc-sidebar-link" routerLink="/alertas" routerLinkActive="active">Alertas</a>
    <a class="sc-sidebar-link" routerLink="/historial" routerLinkActive="active">Historial</a>
    @if (auth.currentUser()?.rol === 'Administrador') {
      <a class="sc-sidebar-link" routerLink="/admin" routerLinkActive="active">Administracion</a>
    }

    <div style="margin-top:auto; padding:12px 8px; font-size:10.5px; color:var(--sc-text-faint); line-height:1.5;">
      Conectado a la API real en localhost:5206.
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column;">
    <div class="sc-topbar">
      <div style="display:flex; align-items:center; gap:8px;">
        <span class="sc-live-dot"></span>
        <span class="sc-mono" style="font-size:12.5px; color:var(--sc-text-muted);">
          {{ now() | date:'dd/MM HH:mm:ss' }}
        </span>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="text-align:right; line-height:1.2;">
          <div style="font-size:12.5px;">{{ auth.currentUser()?.nombreCompleto }}</div>
          <div class="sc-mono" style="font-size:10.5px; color:var(--sc-text-muted);">{{ auth.currentUser()?.rol }}</div>
        </div>
        <button class="sc-btn" (click)="salir()">Salir</button>
      </div>
    </div>
    <div class="sc-content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
